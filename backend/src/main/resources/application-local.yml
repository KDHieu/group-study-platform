spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/group_learning}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.grouplearning.backend: DEBUG