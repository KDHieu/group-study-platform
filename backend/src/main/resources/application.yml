spring:
  application:
    name: group-study-platform

  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/group_learning}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false

  web:
    error:
      include-message: never
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-1234567890}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}

  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:group-study-media}

  livekit:
    internal-url: ${LIVEKIT_INTERNAL_URL:http://localhost:7880}
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secret}

services:
  backend:
    url: ${BACKEND_URL:http://localhost:8081}
    ws-url: ${BACKEND_WS_URL:ws://localhost:8081}