services:
  postgres:
    image: postgres:16
    container_name: group-learning-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-group_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "${POSTGRES_PORT:-5432}:5432"



    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-group_learning}
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: group-study-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    command:
      - server
      - /data
      - --console-address
      - ":9001"

  backend:
    build:
      context: ./backend

    container_name: group-study-backend

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-group_learning}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      SERVER_PORT: 8081

      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-change-me-1234567890}
      JWT_ACCESS_TOKEN_EXPIRATION_SECONDS: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:-3600}

      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: group-study-media

    ports:
      - "${BACKEND_PORT:-8081}:8081"

    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway

    container_name: group-study-gateway

    environment:
      BACKEND_URL: http://backend:8081
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh

    ports:
      - "${GATEWAY_PORT:-8080}:8080"

    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend

    container_name: group-study-frontend

    environment:
      VITE_API_BASE_URL: http://localhost:${GATEWAY_PORT:-8080}/api

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    depends_on:
      - gateway

volumes:
  postgres_data:
  minio_data: