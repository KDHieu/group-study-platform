spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:*"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true

services:
  backend:
    url: ${BACKEND_URL:http://localhost:8081}
    ws-url: ${BACKEND_WS_URL:ws://localhost:8081}

server:
  port: ${SERVER_PORT:8080}